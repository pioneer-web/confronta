# Preserva o protocolo original informado pelo Traefik/Dokploy.
# Se a requisição não vier através do proxy, usa o protocolo observado pelo Nginx.
map $http_x_forwarded_proto $confronta_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Preserva a cadeia de IPs encaminhada pelo Traefik.
# Se não existir X-Forwarded-For, usa o IP que chegou diretamente ao Nginx.
map $http_x_forwarded_for $confronta_forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

# Preserva o IP real informado pelo proxy.
# Se não existir X-Real-IP, usa o endereço da conexão direta.
map $http_x_real_ip $confronta_real_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}


server {
    listen 80;

    # DNS interno do Docker. Re-resolve o serviço web após cada redeploy,
    # evitando 502 quando o container web recebe um novo IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $confronta_backend web:8000;

    server_name confronta.com.br www.confronta.com.br;

    server_tokens off;

    # Regra padrão: endpoints comuns não precisam receber corpos grandes.
    client_max_body_size 1m;


    # -------------------------------------------------------------------------
    # CONSULTA / MAPA
    # -------------------------------------------------------------------------

    # Upload de KML/GeoJSON.
    # Django aceita arquivo de até 5 MB.
    location = /mapa/nova/arquivo/ {
        client_max_body_size 6m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $confronta_real_ip;
        proxy_set_header X-Forwarded-For $confronta_forwarded_for;
        proxy_set_header X-Forwarded-Proto $confronta_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 180;

        proxy_pass http://$confronta_backend;
    }

    # Geometria desenhada enviada em JSON.
    # Django aceita aproximadamente 2 MB.
    location = /mapa/nova/geometria/ {
        client_max_body_size 3m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $confronta_real_ip;
        proxy_set_header X-Forwarded-For $confronta_forwarded_for;
        proxy_set_header X-Forwarded-Proto $confronta_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 180;

        proxy_pass http://$confronta_backend;
    }

    location ^~ /mapa/ {
        client_max_body_size 64k;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $confronta_real_ip;
        proxy_set_header X-Forwarded-For $confronta_forwarded_for;
        proxy_set_header X-Forwarded-Proto $confronta_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 180;

        proxy_pass http://$confronta_backend;
    }


    # -------------------------------------------------------------------------
    # LOGIN ADMINISTRATIVO
    # -------------------------------------------------------------------------

    location = /painel/login/ {
        client_max_body_size 64k;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $confronta_real_ip;
        proxy_set_header X-Forwarded-For $confronta_forwarded_for;
        proxy_set_header X-Forwarded-Proto $confronta_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 180;

        proxy_pass http://$confronta_backend;
    }


    # -------------------------------------------------------------------------
    # ARQUIVOS ESTÁTICOS
    # -------------------------------------------------------------------------

    location /static/ {
        alias /app/staticfiles/;
    }


    # -------------------------------------------------------------------------
    # UPLOAD GIS - LOTE
    # -------------------------------------------------------------------------

    location ^~ /painel/importacoes/lote/ {
        client_max_body_size 0;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $confronta_real_ip;
        proxy_set_header X-Forwarded-For $confronta_forwarded_for;
        proxy_set_header X-Forwarded-Proto $confronta_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;

        proxy_pass http://$confronta_backend;
    }


    # -------------------------------------------------------------------------
    # DEMAIS ROTAS DE IMPORTAÇÃO GIS
    # -------------------------------------------------------------------------

    location ^~ /painel/importar/ {
        client_max_body_size 0;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $confronta_real_ip;
        proxy_set_header X-Forwarded-For $confronta_forwarded_for;
        proxy_set_header X-Forwarded-Proto $confronta_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;

        proxy_pass http://$confronta_backend;
    }


    # -------------------------------------------------------------------------
    # APLICAÇÃO
    # -------------------------------------------------------------------------

    location / {
        client_max_body_size 1m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $confronta_real_ip;
        proxy_set_header X-Forwarded-For $confronta_forwarded_for;
        proxy_set_header X-Forwarded-Proto $confronta_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;

        proxy_pass http://$confronta_backend;
    }
}
