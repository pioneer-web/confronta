# Preserva o protocolo original informado pelo Traefik/Dokploy.
# Se a requisição não vier através do proxy, usa o protocolo observado pelo Nginx.
map $http_x_forwarded_proto $confronta_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Preserva a cadeia de IPs encaminhada pelo Traefik.
# Se não existir X-Forwarded-For, usa o IP que chegou diretamente ao Nginx.
map $http_x_forwarded_for $confronta_forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

# Preserva o IP real informado pelo proxy.
# Se não existir X-Real-IP, usa o endereço da conexão direta.
map $http_x_real_ip $confronta_real_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}


server {
    listen 80;

    server_name confronta.com.br www.confronta.com.br;

    server_tokens off;

    # Regra padrão: endpoints comuns não precisam receber corpos grandes.
    client_max_body_size 1m;


    # -------------------------------------------------------------------------
    # CONSULTA / MAPA
    # -------------------------------------------------------------------------

    location ^~ /mapa/ {
        client_max_body_size 64k;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $confronta_real_ip;
        proxy_set_header X-Forwarded-For $confronta_forwarded_for;
        proxy_set_header X-Forwarded-Proto $confronta_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 180;

        proxy_pass http://web:8000;
    }


    # -------------------------------------------------------------------------
    # LOGIN ADMINISTRATIVO
    # -------------------------------------------------------------------------

    location = /painel/login/ {
        client_max_body_size 64k;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $confronta_real_ip;
        proxy_set_header X-Forwarded-For $confronta_forwarded_for;
        proxy_set_header X-Forwarded-Proto $confronta_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 180;

        proxy_pass http://web:8000;
    }


    # -------------------------------------------------------------------------
    # ARQUIVOS ESTÁTICOS
    # -------------------------------------------------------------------------

    location /static/ {
        alias /app/staticfiles/;
    }


    # -------------------------------------------------------------------------
    # UPLOAD GIS - LOTE
    # -------------------------------------------------------------------------

    location = /painel/importacoes/lote/novo/ {
        client_max_body_size 0;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $confronta_real_ip;
        proxy_set_header X-Forwarded-For $confronta_forwarded_for;
        proxy_set_header X-Forwarded-Proto $confronta_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;

        proxy_pass http://web:8000;
    }


    # -------------------------------------------------------------------------
    # DEMAIS ROTAS DE IMPORTAÇÃO GIS
    # -------------------------------------------------------------------------

    location ^~ /painel/importar/ {
        client_max_body_size 0;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $confronta_real_ip;
        proxy_set_header X-Forwarded-For $confronta_forwarded_for;
        proxy_set_header X-Forwarded-Proto $confronta_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;

        proxy_pass http://web:8000;
    }


    # -------------------------------------------------------------------------
    # APLICAÇÃO
    # -------------------------------------------------------------------------

    location / {
        client_max_body_size 1m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $confronta_real_ip;
        proxy_set_header X-Forwarded-For $confronta_forwarded_for;
        proxy_set_header X-Forwarded-Proto $confronta_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;

        proxy_pass http://web:8000;
    }
}
