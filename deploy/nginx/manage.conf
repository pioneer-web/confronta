# O domínio Manage poderá ser direcionado ao mesmo nginx pelo proxy do Dokploy.
# Os arquivos estáticos vêm do volume compartilhado; uploads vão ao serviço manage.
server {
    listen 80;
    server_name manage.confronta.com.br;
    server_tokens off;

    error_page 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }


    resolver 127.0.0.11 valid=10s ipv6=off;
    set $manage_backend manage:8001;

    client_max_body_size 1m;

    location /static/ {
        alias /app/staticfiles/;
    }

    location ^~ /painel/importacoes/lote/ {
        client_max_body_size 0;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $confronta_real_ip;
        proxy_set_header X-Forwarded-For $confronta_forwarded_for;
        proxy_set_header X-Forwarded-Proto $confronta_forwarded_proto;
        proxy_pass http://$manage_backend;
    }

    location ^~ /painel/importar/ {
        client_max_body_size 0;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $confronta_real_ip;
        proxy_set_header X-Forwarded-For $confronta_forwarded_for;
        proxy_set_header X-Forwarded-Proto $confronta_forwarded_proto;
        proxy_pass http://$manage_backend;
    }

    location / {
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $confronta_real_ip;
        proxy_set_header X-Forwarded-For $confronta_forwarded_for;
        proxy_set_header X-Forwarded-Proto $confronta_forwarded_proto;
        proxy_pass http://$manage_backend;
    }
}
